[package]
name = "equation-desktop"
version = "1.0.0"
description = "Equation.io for the desktop: the graphing calculator, with a graph agent on your own ChatGPT plan."
authors = ["Equation.io contributors"]
license = "MIT"
repository = "https://github.com/aantthony/equation.io"
edition = "2021"
rust-version = "1.85"

[lib]
name = "equation_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "process"] }
tokio-util = "0.7"
futures-util = "0.3"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"

# OAuth credentials live in the OS credential store, never in the webview.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSLocale"] }
objc2-speech = { version = "0.3", features = [
  "SFSpeechRecognizer",
  "SFSpeechRecognitionRequest",
  "SFSpeechRecognitionTask",
  "SFSpeechRecognitionResult",
  "SFTranscription",
  "block2",
  "objc2-avf-audio",
] }
objc2-avf-audio = { version = "0.3", features = [
  "AVAudioEngine",
  "AVAudioNode",
  "AVAudioIONode",
  "AVAudioMixing",
  "AVAudioFormat",
  "AVAudioBuffer",
  "AVAudioTime",
  "AVAudioTypes",
  "block2",
] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# Development builds only: the kernel keyring lasts until logout.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
