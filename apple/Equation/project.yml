# The Apple app: one multiplatform target for iPhone, iPad and Mac.
#
#   pnpm app:web                 # build the renderer page into WebBundle/
#   xcodegen -s apple/Equation/project.yml
#   open apple/Equation/Equation.xcodeproj
name: Equation
options:
  bundleIdPrefix: io.equation
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
packages:
  EquationCore:
    path: ../EquationCore
targets:
  Equation:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources
    dependencies:
      - package: EquationCore
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Equation
        LSSupportsOpeningDocumentsInPlace: true
        # Files ▸ On My iPhone ▸ Equation: where new documents go when there
        # is no iCloud Drive (a simulator, a signed-out device).
        UIFileSharingEnabled: true
        # Every orientation, so iPad multitasking can size the app freely.
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportsDocumentBrowser: true
        UILaunchScreen: {}
        CFBundleDocumentTypes:
          - CFBundleTypeName: Equation Graph
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [io.equation.graph]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.equation.graph
            UTTypeDescription: Equation Graph
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [equation]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.equation.app
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Sources/Assets.xcassets, rendered from web/public/icon.svg by pnpm icons.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 5X6237AEMK
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        # The renderer-copy script reads WebBundle/ from the source tree.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postCompileScripts:
      - name: Bundle the renderer
        basedOnDependencyAnalysis: false
        script: |
          src="$SRCROOT/WebBundle"
          if [ ! -f "$src/native-app/index.html" ]; then
            echo "error: The renderer is not built. Run pnpm app:web in the repository."
            exit 1
          fi
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Web"
          rm -rf "$dest"
          mkdir -p "$dest"
          cp -R "$src/" "$dest/"
