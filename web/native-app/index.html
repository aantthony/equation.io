<!doctype html>
<html lang="en" data-native-app>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Equation.io graph</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/native-app/style.css">
</head>
<body>
  <canvas id="gl" aria-label="Interactive graph"></canvas>
  <canvas id="overlay"></canvas>
  <!-- The rows are edited natively; the web panel stays as the renderer's
       bookkeeping (main.ts reads its lines) and is never shown. -->
  <div id="panel">
    <div id="panel-grip" aria-hidden="true"></div>
    <div id="panel-resize" aria-hidden="true"></div>
    <button id="theme-toggle" type="button" hidden></button>
    <button id="state-reset" type="button" hidden></button>
    <div id="equations" contenteditable="true"></div>
    <details id="data-files" hidden><summary>data files</summary><div id="data-files-list"></div></details>
    <div id="panel-links"></div>
  </div>
  <button id="panel-chip" type="button"></button>
  <script type="module" src="/main.ts"></script>
</body>
</html>
