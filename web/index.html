<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- min+max scale pin the installed app at exactly 1: the graph has its own
       pinch-to-zoom, and a stray page zoom sticks across reloads with no way
       back. Both bounds are needed — maximum-scale alone still leaves WebKit's
       default minimum-scale of 0.25, so a pinch out could shrink the page.
       Safari tabs deliberately ignore these, so ordinary browsing keeps
       pinch-zoom and the accessibility escape hatch. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Equation.io — free online graphing calculator</title>
  <meta name="description" content="Free in-browser graphing calculator. Plot implicit equations, inequalities, complex functions and 3D surfaces, compiled to your GPU as you type. Graphs live in the URL — link to https://equation.io/g/<encoded equations> to open any graph directly.">
  <link rel="canonical" href="https://equation.io/">
  <link rel="alternate" type="text/plain" href="/llms.txt" title="LLM instructions">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Equation.io — free online graphing calculator">
  <meta property="og:description" content="Plot implicit equations, inequalities, complex functions and 3D surfaces in your browser. Graphs live in the URL, so every graph is a shareable link.">
  <meta property="og:url" content="https://equation.io/">
  <meta property="og:image" content="https://equation.io/shots/hero.png">
  <!-- Installed to the Home Screen the app runs without browser chrome, which is
       the only way viewport-fit=cover above can reach under the status bar and
       home indicator. black-translucent puts the graph behind the status bar;
       #panel offsets itself by the safe-area insets to stay clear of it. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Equation">
  <meta name="theme-color" id="theme-color" content="#ffffff">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- Root-relative: this page is also served at /g/<equations> share URLs,
       where a relative href would resolve against /g/ and 404. -->
  <link rel="stylesheet" href="/style.css">
  <!-- Classic script sets the theme before first paint; Vite hashes the asset. -->
  <script src="/theme.js?no-inline"></script>
</head>
<body>
  <canvas id="gl"></canvas>
  <canvas id="overlay"></canvas>
  <div id="panel">
    <!-- Drag affordance for pointers that can't use the panel-wide touch
         drag (a mouse drag over text means selection): grab here to move the
         panel between corners or flick it off-screen. See panel-swipe.ts. -->
    <div id="panel-grip" title="Click to hide the panel; drag to move it" aria-hidden="true"></div>
    <!-- Resize strip on the outer vertical edge (the pinned edge stays
         anchored). Drag to change the panel width; double-click to reset.
         Also an ARIA window splitter: focusable, arrows resize, Home/End
         jump to min/max, Enter resets. panel-resize.ts keeps the aria-value*
         attributes current. -->
    <div id="panel-resize" role="separator" aria-orientation="vertical" tabindex="0"
         aria-label="Resize the equations panel"
         title="Drag to resize the panel; double-click to reset"></div>
    <button id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">☾</button>
    <button id="shot" type="button" aria-label="Download screenshot" title="Download a PNG of the graph. Shift-click to copy.">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
        <path fill="currentColor" d="M4.5 3.5h1.2l.6-1h3.4l.6 1h1.2A1.5 1.5 0 0 1 13 5v6.5A1.5 1.5 0 0 1 11.5 13h-7A1.5 1.5 0 0 1 3 11.5V5A1.5 1.5 0 0 1 4.5 3.5zM8 11a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/>
      </svg>
    </button>
    <button id="rec" type="button" aria-label="Record animation" title="Record the graph as video (up to 8 seconds)" aria-pressed="false">
      <svg class="rec-dot" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
        <circle cx="8" cy="8" r="4.5" fill="currentColor"/>
      </svg>
      <svg class="rec-stop" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
        <rect x="4.5" y="4.5" width="7" height="7" rx="1.2" fill="currentColor"/>
      </svg>
    </button>
    <button id="state-reset" type="button" aria-label="Restart the simulation" title="Restart the simulation" hidden>↻</button>
    <div id="equations" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Equations, one per line" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="enter"></div>
    <!-- CSV files dropped onto the app, kept in this browser (filestore.ts).
         Hidden until there is one; sits above #examples so the panel's link
         row stays anchored to the examples summary. The way IN when there is
         nothing here yet is the "+ csv" link below, beside github. -->
    <details id="data-files" hidden>
      <summary>data files</summary>
      <div id="data-files-list"></div>
    </details>
    <details id="examples">
    <summary>examples</summary>
    <div id="examples-list"></div>
  </details>
    <div id="panel-links">
      <button type="button" id="try-another" title="Load another featured graph">random</button>
      <button id="open-csv" type="button" title="Plot the columns of a CSV file (you can also drop one anywhere)">+ csv</button>
      <a href="https://github.com/aantthony/equation.io" title="Source code on GitHub" rel="noopener">github</a>
      <a id="about-link" href="/about/">about</a>
    </div>
  </div>
  <!-- The panel's collapsed form: swiping the panel off-screen (touch; see
       panel-swipe.ts) leaves this chip in its corner. Tap to spring the panel
       back, or drag to pull it back in. -->
  <button id="panel-chip" type="button" hidden aria-label="Show the equations">y=</button>
  <noscript>
    <h1>Equation.io — free online graphing calculator</h1>
    <p>
      Equation.io plots 2D curves, inequality regions, scalar fields, complex
      functions, 3D surfaces and parametric curves in your browser (WebGL,
      JavaScript required).
    </p>
    <p>
      The entire graph state lives in the URL, so a link can open the
      app with equations already rendered:
      <code>https://equation.io/g/&lt;equation&gt;;&lt;equation&gt;;...</code> —
      percent-encode each equation (encodeURIComponent, plus parens as %28
      %29), join with <code>;</code>. Examples: a parabola is
      https://equation.io/g/y%20%3D%20x%5E2 and a 3D cylinder is
      https://equation.io/g/%28cos%282pi%20u%29%2C%20sin%282pi%20u%29%2C%204v-2%29
    </p>
    <p>
      Full expression syntax and deep-link reference for AI assistants:
      <a href="/llms.txt">https://equation.io/llms.txt</a>. To show a user a
      graph, reply with a single https://equation.io/g/... link. Feature
      gallery: <a href="/about/">https://equation.io/about/</a>
    </p>
  </noscript>
  <script type="module" src="/main.ts"></script>
</body>
</html>
